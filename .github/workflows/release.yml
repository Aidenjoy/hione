  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/hi-tauri/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: cd crates/hi-tauri && npm ci && npm run build

      - name: Build CLI binaries
        run: cargo build --release -p hi-cli -p hi-monitor

      - name: Build Tauri desktop app
        run: cd crates/hi-tauri && cargo tauri build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME
          
          # 1) Copy MSI installer
          $msi = Get-ChildItem -Path 'target\release\bundle\msi' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            $msi = Get-ChildItem -Path 'target\release\bundle' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "HiOne-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "✅ MSI installer copied: $dest"
          } else {
            Write-Host "❌ No MSI installer found" -ForegroundColor Red
            exit 1
          }
          
          # 2) Copy NSIS installer (optional)
          $nsis = Get-ChildItem -Path 'target\release\bundle\nsis' -Recurse -Include *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -ne $nsis) {
            $dest = "HiOne-$VERSION-Windows-Setup.exe"
            Copy-Item $nsis.FullName (Join-Path release-assets $dest)
            Write-Host "✅ NSIS installer copied: $dest"
          } else {
            Write-Host "⚠️ No NSIS installer found (optional)" -ForegroundColor Yellow
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hione-windows
          path: release-assets/*

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hione-macos/*.zip
            hione-macos/*.dmg
            hione-linux/*.AppImage
            hione-linux/*.deb
            hione-windows/*.msi
            hione-windows/*.exe
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: false