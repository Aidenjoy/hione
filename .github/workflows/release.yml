name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/hi-tauri/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: cd crates/hi-tauri && npm ci && npm run build

      - name: Build CLI binaries (universal)
        run: |
          cargo build --release -p hi-cli -p hi-monitor --target aarch64-apple-darwin
          cargo build --release -p hi-cli -p hi-monitor --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/hi \
            target/aarch64-apple-darwin/release/hi \
            target/x86_64-apple-darwin/release/hi
          lipo -create -output target/release/hi-monitor \
            target/aarch64-apple-darwin/release/hi-monitor \
            target/x86_64-apple-darwin/release/hi-monitor

      - name: Build Tauri desktop app (universal)
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "=== macOS build attempt ${attempt}/${max_attempts} ==="
            if cd crates/hi-tauri && cargo tauri build --target universal-apple-darwin; then
              echo "✅ macOS build succeeded"
              exit 0
            fi
            if [ "$attempt" -eq $max_attempts ]; then
              echo "❌ macOS build failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build failed, retrying in ${sleep_seconds}s..."
            sleep $sleep_seconds
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Package aclease erlhivrive
