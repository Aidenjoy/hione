name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-universal

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/hi-tauri/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: cd crates/hi-tauri && npm ci && npm run build

      - name: Build CLI binaries (universal)
        run: |
          cargo build --release -p hi-cli -p hi-monitor --target aarch64-apple-darwin
          cargo build --release -p hi-cli -p hi-monitor --target x86_64-apple-darwin
          
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/hi \
            target/aarch64-apple-darwin/release/hi \
            target/x86_64-apple-darwin/release/hi
          lipo -create -output target/universal-apple-darwin/release/hi-monitor \
            target/aarch64-apple-darwin/release/hi-monitor \
            target/x86_64-apple-darwin/release/hi-monitor
          
          mkdir -p target/release
          cp target/universal-apple-darwin/release/hi target/release/hi
          cp target/universal-apple-darwin/release/hi-monitor target/release/hi-monitor

      - name: Build Tauri desktop app (universal)
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "=== macOS build attempt ${attempt}/${max_attempts} ==="
            if cd crates/hi-tauri && cargo tauri build --target universal-apple-darwin --bundles app,dmg; then
              echo "✅ macOS build succeeded"
              exit 0
            fi
            if [ "$attempt" -eq $max_attempts ]; then
              echo "❌ macOS build failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 60))
            echo "⚠️ macOS build failed, retrying in ${sleep_seconds}s..."
            sleep $sleep_seconds
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Prepare macOS Assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          
          DMG_PATH=$(find target/universal-apple-darwin/release/bundle/macos -name "*.dmg" -maxdepth 1 | head -1 || true)
          
          if [ -z "$DMG_PATH" ]; then
            echo "❌ No .dmg found" >&2
            exit 1
          fi
          
          DMG_NAME="HiOne-${VERSION}-macOS.dmg"
          cp "$DMG_PATH" "release-assets/$DMG_NAME"
          echo "✅ macOS dmg copied: $DMG_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: hione-macos
          path: release-assets/*

  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/hi-tauri/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: cd crates/hi-tauri && npm ci && npm run build

      - name: Build CLI binaries
        run: cargo build --release -p hi-cli -p hi-monitor

      - name: Build Tauri desktop app
        run: |
          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "=== Linux build attempt ${attempt}/${max_attempts} ==="
            if cd crates/hi-tauri && cargo tauri build --bundles deb; then
              echo "✅ Linux build succeeded"
              exit 0
            fi
            if [ "$attempt" -eq $max_attempts ]; then
              echo "❌ Linux build failed after ${max_attempts} attempts" >&2
              exit 1
            fi
            sleep_seconds=$((attempt * 60))
            echo "⚠️ Linux build failed, retrying in ${sleep_seconds}s..."
            sleep $sleep_seconds
          done
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Prepare Linux Assets
        run: |
          set -euxo pipefail
          mkdir -p release-assets
          VERSION="${GITHUB_REF_NAME}"
          
          DEB=$(find target/release/bundle/deb -name "*.deb" | head -1 || true)
          
          if [ -z "$DEB" ]; then
            echo "❌ No .deb found" >&2
            exit 1
          fi
          
          DEB_NAME="HiOne-${VERSION}-Linux.deb"
          cp "$DEB" "release-assets/$DEB_NAME"
          echo "✅ Deb package copied: $DEB_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: hione-linux
          path: release-assets/*

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: crates/hi-tauri/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --locked

      - name: Build frontend
        run: cd crates/hi-tauri && npm ci && npm run build

      - name: Build CLI binaries
        run: cargo build --release -p hi-cli -p hi-monitor

      - name: Build Tauri desktop app
        run: |
          $max_attempts = 3
          for ($attempt = 1; $attempt -le $max_attempts; $attempt++) {
            Write-Host "=== Windows build attempt $attempt/$max_attempts ==="
            cd crates/hi-tauri
            if (cargo tauri build --bundles msi) {
              Write-Host "✅ Windows build succeeded"
              exit 0
            }
            if ($attempt -eq $max_attempts) {
              Write-Host "❌ Windows build failed after $max_attempts attempts"
              exit 1
            }
            $sleep_seconds = $attempt * 60
            Write-Host "⚠️ Windows build failed, retrying in $sleep_seconds seconds..."
            Start-Sleep -Seconds $sleep_seconds
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Prepare Windows Assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $VERSION = $env:GITHUB_REF_NAME
          
          $msi = Get-ChildItem -Path 'target\release\bundle\msi' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($null -eq $msi) {
            $msi = Get-ChildItem -Path 'target\release\bundle' -Recurse -Include *.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($null -ne $msi) {
            $dest = "HiOne-$VERSION-Windows.msi"
            Copy-Item $msi.FullName (Join-Path release-assets $dest)
            Write-Host "✅ MSI installer copied: $dest"
          } else {
            Write-Host "❌ No MSI installer found" -ForegroundColor Red
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: hione-windows
          path: release-assets/*

  release:
    needs: [build-macos, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hione-macos/*.dmg
            hione-linux/*.deb
            hione-windows/*.msi
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true